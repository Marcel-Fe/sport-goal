name: Build & Deploy (mit frischen News)

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/30 * * * *' # alle 30 Min: News auffrischen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Web
        run: npx expo export -p web

      - name: Pages-Dateien (Icon, Manifest, 404)
        run: node scripts/prep-dist.js

      - name: Frische News holen (serverseitig, kein CORS)
        run: node scripts/build-news.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
