<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; }
  .icon {
    position: relative;
    width: 1024px; height: 1024px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 78% 12%, rgba(255,255,255,0.38), rgba(255,255,255,0) 55%),
      linear-gradient(150deg, #FF2238 0%, #D80022 45%, #8A0012 100%);
    font-family: "Arial Black", Arial, system-ui, sans-serif;
  }
  /* dezente Stadion-Lichtstreifen */
  .beam {
    position: absolute; top: -200px; right: -120px;
    width: 700px; height: 1400px;
    background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
    transform: rotate(28deg);
    filter: blur(8px);
  }
  .ring {
    position: absolute; inset: 70px;
    border: 10px solid rgba(255,255,255,0.18);
    border-radius: 180px;
  }
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .sg {
    font-size: 560px; font-weight: 900; font-style: italic;
    color: #FFFFFF; line-height: 1; letter-spacing: -20px;
    text-shadow: 0 18px 50px rgba(0,0,0,0.35);
    margin-top: -40px;
  }
  .word {
    margin-top: 28px;
    font-size: 92px; font-weight: 900; font-style: italic;
    letter-spacing: 6px; color: #FFFFFF;
  }
  .word .goal { color: #0A0E18; }
  .dot {
    position: absolute; bottom: 150px;
    width: 0; height: 0;
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="beam"></div>
    <div class="ring"></div>
    <div class="center">
      <div class="sg">SG</div>
      <div class="word">SPORT <span class="goal">GOAL</span></div>
    </div>
  </div>
</body>
</html>
